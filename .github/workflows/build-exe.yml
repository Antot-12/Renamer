name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download UPX
        run: |
          curl -L -o upx.zip https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip
          Expand-Archive -Path upx.zip -DestinationPath .
          Rename-Item upx-4.2.4-win64 upx

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name=Renamer --icon=rename.ico --noconfirm --clean --upx-dir=upx --strip --exclude-module=matplotlib --exclude-module=numpy --exclude-module=pandas --exclude-module=scipy --exclude-module=pytest --exclude-module=setuptools --exclude-module=wheel --exclude-module=pip --exclude-module=tkinterdnd2 --exclude-module=unittest --exclude-module=pydoc --hidden-import=PIL._tkinter_finder run.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Renamer-Windows
          path: dist/Renamer.exe
