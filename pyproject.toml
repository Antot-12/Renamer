[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renamer"
version = "1.0.0"
description = "A cross-platform desktop GUI application for batch file renaming"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Anton Shyrko"}
]
keywords = ["renamer", "batch", "files", "audio", "metadata", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.9"
dependencies = [
    "mutagen>=1.45.0",
    "Pillow>=9.0.0",
    "tkinterdnd2>=0.3.0",
    "ttkbootstrap>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "pyinstaller>=5.0.0",
]

[project.scripts]
renamer = "renamer.app:main"

[project.gui-scripts]
renamer-gui = "renamer.app:main"

[project.urls]
Homepage = "https://github.com/Antot-12/Renamer"
Repository = "https://github.com/Antot-12/Renamer"
Issues = "https://github.com/Antot-12/Renamer/issues"

[tool.setuptools.packages.find]
include = ["renamer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["renamer"]
omit = ["renamer/app.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
